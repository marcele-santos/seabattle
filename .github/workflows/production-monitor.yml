name: Production monitor

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages
        env:
          SITE_URL: https://marcele-santos.github.io/seabattle
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$SITE_URL/" -o /tmp/index.html
          grep -qi '<title>Batalha Naval</title>' /tmp/index.html
          grep -q './src/main.js' /tmp/index.html
          curl --fail --silent --show-error --retry 3 "$SITE_URL/src/main.js" -o /dev/null
          curl --fail --silent --show-error --retry 3 "$SITE_URL/styles.css" -o /dev/null
          echo "GitHub Pages: HTML, JavaScript e CSS responderam corretamente."

      - name: Check Supabase public leaderboard
        env:
          SUPABASE_URL: https://fgvceipvuugshkpirphv.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_8DaoiKpPd3uldLVPiVsd9A_xp7prc7Y
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_leaderboard" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{}' -o /tmp/leaderboard.json
          node --input-type=module -e '
            import fs from "node:fs";
            const rows = JSON.parse(fs.readFileSync("/tmp/leaderboard.json", "utf8"));
            if (!Array.isArray(rows)) throw new Error("Leaderboard RPC did not return an array");
            for (const row of rows) {
              for (const key of ["position", "display_name", "score", "shots", "hits", "achieved_at"]) {
                if (!(key in row)) throw new Error("Leaderboard row missing " + key);
              }
            }
            console.log("Supabase leaderboard: RPC returned " + rows.length + " valid row(s).");
          '
